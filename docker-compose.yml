services:
  nginx:
    build:
      context: ./app
    container_name: nginx
    ports:
      # The application is the only service intended for direct remote access.
      # On EC2, its security-group rule is restricted to the operator's CIDR.
      - "8083:80"
    volumes:
      - ./app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  tester:
    # Diagnostic-only container for proving internal Compose DNS/networking.
    image: curlimages/curl:8.10.1
    container_name: tester
    entrypoint: ["sleep", "infinity"]
    depends_on:
      - nginx
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: nginx-exporter
    command:
      - "--nginx.scrape-uri=http://nginx/stub_status"
    ports:
      # Loopback-only: available for host diagnostics, never directly public.
      - "127.0.0.1:9113:9113"
    depends_on:
      - nginx
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      # Loopback-only on EC2; use the Terraform output's SSM tunnel command.
      - "127.0.0.1:9090:9090"
    depends_on:
      - nginx-exporter
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets/webhook_token:/etc/alertmanager/webhook_token:ro
    ports:
      # Loopback-only on EC2; use the Terraform output's SSM tunnel command.
      - "127.0.0.1:9093:9093"
    depends_on:
      - recovery-webhook
    restart: unless-stopped

  recovery-webhook:
    build:
      context: ./recovery/webhook
    container_name: recovery-webhook
    environment:
      WEBHOOK_TOKEN_FILE: /run/secrets/webhook_token
      RECOVERY_COOLDOWN_SECONDS: "60"
      RECOVERY_MAX_ATTEMPTS: "3"
      RECOVERY_ATTEMPT_WINDOW_SECONDS: "600"
    volumes:
      - ./recovery/ansible:/ansible:ro
      - ./secrets/webhook_token:/run/secrets/webhook_token:ro
      # LAB-ONLY RISK: Docker socket access is effectively root-level control
      # of this host. Keep /recover internal and destroy the EC2 lab after use.
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "5000"
    depends_on:
      - nginx
    restart: unless-stopped
