server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Health endpoint used by recovery validation (Ansible uri module later).
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # NGINX's built-in stub_status module — exposes basic connection/request
    # counters in a simple text format. The nginx-prometheus-exporter service
    # scrapes THIS endpoint and re-exposes it in Prometheus format on :9113.
    location = /stub_status {
        stub_status;
        allow all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
